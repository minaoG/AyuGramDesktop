name: Windows.

# Adapted from telegramdesktop/tdesktop .github/workflows/win.yml.
# Trimmed to a single x64 + Qt6 configuration and retargeted at the
# AyuGram executable name, since AyuGramDesktop ships no CI of its own.

on:
  workflow_dispatch:
    inputs:
      only_cache:
        description: "Only warm the dependency caches, do not build AyuGram"
        type: boolean
        default: false
      build_type:
        description: "CMake configuration to build"
        type: choice
        options:
          - Debug
          - Release
        default: Debug

jobs:

  windows:
    name: Windows x64 (Qt6)
    runs-on: windows-latest

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: ${{ inputs.only_cache && 'true' || 'false' }}
      BUILD_TYPE: ${{ inputs.build_type || 'Debug' }}
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      LIBS_VARIANT: ${{ (inputs.build_type || 'Debug') == 'Release' && 'rel' || 'dbg' }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Disk space.
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}},@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} | Format-Table -AutoSize

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.LIBS_VARIANT }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-${{ env.LIBS_VARIANT }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat ${{ (inputs.build_type || 'Debug') == 'Debug' && 'skip-release' || '' }} silent qt6

      - name: Resolve API credentials.
        shell: bash
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "Using the repository API credentials."
            echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> $GITHUB_ENV
          else
            echo "::warning::TDESKTOP_API_ID / TDESKTOP_API_HASH secrets are not set, falling back to TDESKTOP_API_TEST. The resulting binary will not be able to sign into production Telegram accounts."
            echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_TEST=ON" >> $GITHUB_ENV
          fi

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Redirect the build tree to the large drive.
        if: env.ONLY_CACHE == 'false'
        run: |
          mkdir D:\BuildOut
          mklink /d %TBUILD%\%REPO_NAME%\out D:\BuildOut

      - name: Runner resources before build.
        if: env.ONLY_CACHE == 'false'
        shell: pwsh
        run: |
          "Logical processors: $env:NUMBER_OF_PROCESSORS"
          "RAM GB: " + [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1)
          Get-CimInstance Win32_PageFileUsage | Select-Object Name,AllocatedBaseSize,CurrentUsage | Format-Table -AutoSize | Out-String -Width 100
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}},@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} | Format-Table -AutoSize | Out-String -Width 80

      - name: AyuGram build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          -G "Ninja Multi-Config" ^
          qt6 ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=%BUILD_TYPE% ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
          -D CMAKE_EXE_LINKER_FLAGS=Dnsapi.lib

          cmake --build ..\out --config %BUILD_TYPE% --parallel 2

      - name: Move artifact.
        if: (env.ONLY_CACHE == 'false') && (env.UPLOAD_ARTIFACT == 'true')
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\%BUILD_TYPE%
          mkdir artifact
          move %OUT%\AyuGram.exe artifact/
          if exist %OUT%\Updater.exe move %OUT%\Updater.exe artifact/

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: (env.ONLY_CACHE == 'false') && (env.UPLOAD_ARTIFACT == 'true')
        with:
          name: AyuGram-x64-qt6-${{ env.BUILD_TYPE }}
          path: artifact\
          retention-days: 7
          if-no-files-found: error
